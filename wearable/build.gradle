plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = 'com.alchemiasoft.books'
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId = rootProject.ext.applicationId
        minSdk = 25
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode = rootProject.ext.versionCode
        versionName = rootProject.ext.versionName
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        compose = true
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation platform("androidx.compose:compose-bom:${rootProject.ext.composeBom}")
    implementation "androidx.wear.compose:compose-material3:${rootProject.ext.wearCompose}"
    implementation "androidx.wear.compose:compose-foundation:${rootProject.ext.wearCompose}"
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.13.0'
    // Play Services pulls in an old androidx.fragment; ActivityResult APIs need 1.3+.
    implementation 'androidx.fragment:fragment-ktx:1.8.9'
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:${rootProject.ext.lifecycle}"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:${rootProject.ext.lifecycle}"
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation project(':common')

    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation platform("androidx.compose:compose-bom:${rootProject.ext.composeBom}")
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}
