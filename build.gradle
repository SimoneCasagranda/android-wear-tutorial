// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '9.5.2' apply false
    id 'com.android.library' version '9.5.2' apply false
    // AGP 9 compiles Kotlin itself (built-in Kotlin); this only pins the Kotlin compiler version.
    id 'org.jetbrains.kotlin.android' version '2.4.21' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.21' apply false
}

ext {
    // androidx.core 1.19 (pulled in by Compose) requires compiling against API 37; the target stays 36.
    compileSdkVersion = 37
    targetSdkVersion = 36
    applicationId = 'com.alchemiasoft.android_wear_tutorial'
    versionCode = 8
    versionName = '2.0'

    composeBom = '2026.09.00'
    wearCompose = '1.7.2'
    lifecycle = '2.11.1'
}
